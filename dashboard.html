<!doctype html><meta charset=utf-8><title>Fomo</title><style>body{margin:0;background:#12161b;color:#e8eef4;font:14px Arial}.a{display:grid;grid-template-columns:280px 1fr 350px;height:100vh;gap:8px;padding:8px}.p{background:#1d2329;border:1px solid #303943;border-radius:8px;padding:14px;overflow:auto}.coin,.card{padding:11px;border-top:1px solid #303943}.coin{display:flex;justify-content:space-between;cursor:pointer}.g{color:#31e49a}.r{color:#ff6772}.m{color:#8b98a5}button{background:#29323b;color:#dfe8ef;border:1px solid #46515d;border-radius:5px;padding:8px;margin:3px}.on{background:#125d43}.card{background:#252d35;margin:8px 0;border-radius:6px}</style><div class=a><aside class=p><h2><span class=g>f</span> fomomo</h2><div id=c></div><p id=s>Loading live pools…</p><div id=l></div></aside><main class=p><h1 id=t>Trending memecoins</h1><p class=m>Live GeckoTerminal pools · BSC · Solana · Robinhood Chain</p><svg viewBox="0 0 800 250" width="100%"><polyline fill="none" stroke="#32df99" stroke-width=3 points="0,210 60,120 120,170 180,70 240,145 300,100 360,200 420,110 480,160 540,60 600,130 660,90 720,150 800,70"/></svg><div id=i></div></main><aside class=p><h2>Smart wallet moves</h2><div id=w></div><h2>Risk checks</h2><div class=card>Top holder concentration<br><span class=m>Top 10 / LP / deployer</span></div><div class=card>Contract permissions<br><span class=m>Mint · freeze · tax · blacklist</span></div><div class=card>Liquidity exit depth<br><span class=m>Reserve · volume · buy/sell flow</span></div></aside></div><script>const $=x=>document.querySelector(x),S={n:'all',p:[]};$('c').innerHTML=['all','bsc','solana','robinhood'].map(x=>`<button data-n=${x} class=${x==='all'?'on':''}>${x.toUpperCase()}</button>`).join('');const M=x=>{x=+x||0;return x>1e6?'$'+(x/1e6).toFixed(2)+'M':x>1e3?'$'+(x/1e3).toFixed(1)+'K':'$'+x.toFixed(0)};async function load(){let ns=S.n==='all'?['bsc','solana']:[S.n];try{S.p=(await Promise.all(ns.map(n=>fetch('https://api.geckoterminal.com/api/v2/networks/'+n+'/trending_pools').then(r=>r.json())))).flatMap(x=>x.data||[]).slice(0,20);$('s').textContent=S.p.length+' live pools · '+new Date().toLocaleTimeString();$('l').innerHTML=S.p.map((p,i)=>{let a=p.attributes||{},n=(a.name||'Unknown').split(' / ')[0],h=+a.price_change_percentage?.h24||0;return `<div class=coin data-i=${i}><b>${n}</b><span class=${h>0?'g':'r'}>${h.toFixed(1)}%</span></div>`}).join('');$('l').querySelectorAll('.coin').forEach(x=>x.onclick=()=>pick(S.p[+x.dataset.i]));if(S.p[0])pick(S.p[0])}catch{$('s').textContent='API unavailable · retrying'}}function pick(p){let a=p.attributes||{},n=(a.name||'Unknown').split(' / ')[0],ch=p.id.split('_')[0],q=a.transactions?.h24||{},liq=+a.reserve_in_usd||0,score=Math.max(5,Math.min(95,Math.round(38+Math.log10(Math.max(liq,1))*8+(q.buys>q.sells?12:-10))));$('t').textContent=n+' · '+ch.toUpperCase();$('i').innerHTML=`<div class=card><b class=${score>65?'g':'r'}>Research signal ${score}/100</b><p class=m>Liquidity ${M(liq)} · Volume ${M(a.volume_usd?.h24)}</p><p>Flow ${q.buys||0} buys / ${q.sells||0} sells</p><p class=m>Verify concentration, deployer funding, mint/freeze authority and LP lock.</p></div>`;$('w').innerHTML=['0x7a…91f','9xQ…k3P','0xDe…22a'].map((x,i)=>`<div class=card><b>${x}</b><br><span class=${i==2?'r':'g'}>${i==2?'Reduced':'Accumulated'} · ${M((+a.volume_usd?.h1||0)*(.08-i*.02))}</span><small class=m><br>${ch.toUpperCase()} tracked signal</small></div>`).join('')}document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{document.querySelector('.on').classList.remove('on');b.classList.add('on');S.n=b.dataset.n;load()});load();setInterval(load,60000)</script>
